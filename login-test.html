<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase 账号测试</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
  input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
  button { padding: 10px 20px; margin: 5px 5px 5px 0; background: #111; color: #fff; border: none; cursor: pointer; }
  #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; min-height: 50px; word-break: break-all; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>Supabase 账号注册与登录</h2>

<p><strong>1. 填入你的门牌号和钥匙：</strong></p>
<input type="text" id="supabaseUrl" value="请粘贴你的_project_url" />
<input type="text" id="supabaseKey" value="请粘贴你的_publishable_key" />

<p><strong>2. 填写账号密码：</strong></p>
<input type="email" id="email" placeholder="输入邮箱" value="" />
<input type="password" id="password" placeholder="输入密码（至少6位）" value="" />

<button id="btnSignUp">注册新账号</button>
<button id="btnSignIn">登录已有账号</button>

<div id="result">等待操作...</div>

<script>
  let myClient = null;

  function initSupabase() {
    const url = document.getElementById('supabaseUrl').value.trim();
    const key = document.getElementById('supabaseKey').value.trim();
    
    if (!url || url === '请粘贴你的_project_url') {
      document.getElementById('result').innerText = '请先填写你的 Project URL 和 Publishable key！';
      return false;
    }
    // 注意：这里用 window.supabase 避免变量冲突
    myClient = window.supabase.createClient(url, key);
    return true;
  }

  // 注册新账号
  document.getElementById('btnSignUp').onclick = async function() {
    if (!initSupabase()) return;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return alert('请填写邮箱和密码');

    document.getElementById('result').innerText = '正在注册...';
    
    const { data, error } = await myClient.auth.signUp({ email, password });
      
    if (error) {
      document.getElementById('result').innerText = '注册失败：' + error.message;
    } else {
      document.getElementById('result').innerText = '注册成功！请到 Supabase 后台的 Authentication -> Users 查看这个用户。\n' + JSON.stringify(data.user, null, 2);
    }
  };

  // 登录已有账号
  document.getElementById('btnSignIn').onclick = async function() {
    if (!initSupabase()) return;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return alert('请填写邮箱和密码');

    document.getElementById('result').innerText = '正在登录...';
    
    const { data, error } = await myClient.auth.signInWithPassword({ email, password });

    if (error) {
      document.getElementById('result').innerText = '登录失败：' + error.message;
    } else {
      document.getElementById('result').innerText = '登录成功！\n登录邮箱：' + data.user.email + '\n用户ID：' + data.user.id;
    }
  };
</script>
</body>
</html>
