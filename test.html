<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase 连接测试</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
  input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
  button { padding: 10px 20px; margin: 5px 5px 5px 0; background: #111; color: #fff; border: none; cursor: pointer; }
  #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; min-height: 50px; word-break: break-all; }
</style>
<!-- 引入 Supabase 的官方前端库 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>Supabase 连接测试</h2>

<p><strong>1. 填入你的门牌号和钥匙：</strong></p>
<input type="text" id="supabaseUrl" value="https://veposzblhmkcqxjqeqpym.supabase.co" />
<input type="text" id="supabaseKey" value="sb_publishable_i5a7ALhLYrsncz6OeyCAEA_TabIUsdF" />

<p><strong>2. 测试写入和读取：</strong></p>
<input type="text" id="testContent" placeholder="随便输入点什么" value="Hello Supabase" />

<!-- 注意：我们把点击事件和函数都在这里绑定好 -->
<button id="btnWrite">写入数据</button>
<button id="btnRead">读取数据</button>

<div id="result">等待操作...</div>

<script>
  // 使用不同的变量名，避免和官方库的全局变量冲突
  let myClient = null;

  // 初始化连接（使用官方库的标准写法）
  function initSupabase() {
    const url = document.getElementById('supabaseUrl').value.trim();
    const key = document.getElementById('supabaseKey').value.trim();
    
    // 如果网址或钥匙没填，就不初始化
    if (!url || url === '请在这里粘贴你的_project_url') {
      document.getElementById('result').innerText = '请先填写你的 Project URL 和 Publishable key！';
      return false;
    }
    
    // 使用 window.supabase 来调用官方库，而不是直接写 supabase
    myClient = window.supabase.createClient(url, key);
    return true;
  }

  // 写入数据
  document.getElementById('btnWrite').onclick = async function() {
    if (!initSupabase()) return; // 初始化失败就停掉
    
    const content = document.getElementById('testContent').value;
    if (!content) return alert('请先输入内容');
    
    document.getElementById('result').innerText = '正在写入...';
    
    const { data, error } = await myClient
      .from('test_table')
      .insert([{ content: content }]);
      
    if (error) {
      document.getElementById('result').innerText = '写入失败：' + error.message;
    } else {
      document.getElementById('result').innerText = '写入成功！数据已经存到云服务器了。';
    }
  };

  // 读取数据
  document.getElementById('btnRead').onclick = async function() {
    if (!initSupabase()) return; // 初始化失败就停掉
    
    document.getElementById('result').innerText = '正在读取...';
    
    const { data, error } = await myClient
      .from('test_table')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('result').innerText = '读取失败：' + error.message;
    } else {
      let html = '<strong>读取成功！云端目前的数据：</strong><br><br>';
      data.forEach(item => {
        html += `[ID: ${item.id}] ${item.content} (时间: ${item.created_at})<br>`;
      });
      document.getElementById('result').innerHTML = html || '云端目前没有数据。';
    }
  };
</script>
</body>
</html>
